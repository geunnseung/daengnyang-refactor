spring:
  datasource:
    url: jdbc:h2:mem:nyangai-test;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: ture
        generate_statistics: true

jwt:
  access-token-secret: test-access-token-secret-key-must-be-at-least-32-bytes
  access-token-expiration-millis: 1800000

auth:
  refresh-token-expiration-days: 7

app:
  s3:
    region: ap-northeast-2
    bucket: test-bucket
    key-prefix: test
    base-url: https://test-bucket.s3.ap-northeast-2.amazonaws.com